services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: review_spine
      POSTGRES_PASSWORD: review_spine
      POSTGRES_DB: review_spine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_spine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local
      TIGER_DATABASE_URL: postgresql+asyncpg://review_spine:review_spine@postgres:5432/review_spine
      REDIS_URL: redis://redis:6379/0
      GITHUB_WEBHOOK_SECRET: local-demo-secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    environment:
      APP_ENV: local
      REDIS_URL: redis://redis:6379/0
      GITHUB_WEBHOOK_SECRET: local-demo-secret
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

