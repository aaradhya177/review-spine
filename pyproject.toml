[project]
name = "review-spine"
version = "0.1.0"
description = "AI pull-request review agent with specialist fan-out and an auditable data spine."
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.0",
    "alembic>=1.18.0",
    "arq>=0.26.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.137.0",
    "langgraph>=0.2.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.13.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
